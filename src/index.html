<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MyAngular2026</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Favicon: Sets the browser tab icon for your application -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    
    <!-- Font Awesome Icons: Provides access to Font Awesome icon library for rich icon support throughout the app -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    
    <!-- Google Fonts DNS Preconnect: Optimizes loading speed by pre-establishing connection to Google Fonts server -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    
    <!-- Google Fonts CDN Preconnect: Pre-establishes connection to Google's font asset server for faster font delivery -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Roboto Font Family: Imports Google's Roboto font (weights 300, 400, 500) for consistent Material Design typography -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    
    <!-- Material Icons: Loads Google's Material Design icon font for Angular Material components -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
